[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataiku-databricks-migration"
version = "0.1.0"
description = "Deterministic Dataiku to Databricks migration framework"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dataiku-databricks-migrate = "migration_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
